name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: python -m compileall -q config.py contacts.py crypto.py db.py message.py server.py scripts/common scripts/windows
      - if: runner.os == 'macOS'
        run: bash -n setup.sh scripts/macos/extract_key.sh
